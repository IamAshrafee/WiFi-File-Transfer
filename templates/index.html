<!DOCTYPE html>
<html>
  <head>
    <title>WiFi File Transfer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='images/favicon.svg') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1a73e8",
              "primary-dark": "#1557b0",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="min-h-screen bg-gray-100 dark:bg-gray-900 p-4 md:p-6 transition-colors duration-200"
  >
    <!-- Dark Mode Toggle -->
    <div class="absolute top-4 right-4">
      <button
        id="theme-toggle"
        class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
        aria-label="Toggle dark mode"
      >
        <svg
          class="w-6 h-6 text-primary dark:text-blue-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            class="dark:hidden"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
          <path
            class="hidden dark:block"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>
    </div>

    <div
      class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden p-6 md:p-8"
    >
      <div class="text-center">
        <img
          src="{{ url_for('static', filename='images/logo.svg') }}"
          alt="WiFi File Transfer"
          class="w-24 h-24 mx-auto mb-6 text-primary dark:text-blue-400"
        />
        <h1
          class="text-2xl md:text-3xl font-bold text-primary dark:text-blue-400 mb-8"
        >
          WiFi File Transfer
        </h1>

        <form
          class="upload-form space-y-6"
          action="/upload"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="flex flex-col items-center">
            <label for="file-input" class="w-full">
              <div
                id="drop-zone"
                class="w-full border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-6 cursor-pointer hover:border-primary dark:hover:border-blue-400 transition-colors"
              >
                <div class="text-center">
                  <svg
                    class="mx-auto h-12 w-12 text-primary dark:text-blue-400"
                    stroke="currentColor"
                    fill="none"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                  >
                    <path
                      d="M24 8l12 12m0 0l-12 12m12-12H12"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <div
                    class="mt-4 flex text-sm text-gray-600 dark:text-gray-400 align-center justify-center"
                  >
                    <span
                      class="relative rounded-md font-medium text-primary dark:text-blue-400 hover:text-primary-dark dark:hover:text-blue-300 focus-within:outline-none"
                    >
                      Upload files
                    </span>
                    <p class="pl-1">or drag and drop</p>
                  </div>
                </div>
              </div>
              <input
                id="file-input"
                type="file"
                name="file"
                class="hidden"
                required
                multiple
                aria-label="Choose files to upload"
              />
            </label>
          </div>

          <div id="file-list" class="mt-4 space-y-2 text-left"></div>

          <!-- Upload Progress -->
          <div id="upload-progress" class="hidden">
            <div
              class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-2"
            >
              <div
                id="progress-bar"
                class="bg-primary dark:bg-blue-400 h-2.5 rounded-full transition-all duration-300"
                style="width: 0%"
              ></div>
            </div>
            <p
              id="progress-text"
              class="text-sm text-gray-600 dark:text-gray-400"
            ></p>
          </div>

          <button
            type="submit"
            id="upload-button"
            class="w-full bg-primary dark:bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-primary-dark dark:hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
          >
            Upload Files
          </button>
        </form>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-4 right-4 hidden">
          <div
            class="bg-primary dark:bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg"
          >
            <div class="flex items-center space-x-2">
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
              <span id="toast-message"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
